[project]
name = "portable-agent-runtime"
version = "0.1.0"
description = "Stateless proposal runtime for Portable Agent"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
  "fastapi==0.141.1",
  "PyJWT[crypto]>=2.13,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "jsonschema[format]>=4.25,<5",
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10",
  "mypy>=1.17,<3",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "PyYAML>=6.0,<7",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
  "types-PyYAML>=6.0,<7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portable_agent"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["RUF001"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=portable_agent.services --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["src"]
