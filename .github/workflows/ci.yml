name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    uses: portable-agent/.github/.github/workflows/reusable-python.yml@main
    with:
      python-version: "3.14"
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run mkdocs build --strict
  container:
    needs: [python, docs]
    uses: portable-agent/.github/.github/workflows/reusable-container.yml@main
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image-name: agent-runtime
